[pytest]
# Extend sys.path once during collection so tests can import modules from the
# hyphenated scripts/ subdirectories (e.g. scripts/pypsa-at, scripts/open-tyndp),
# whose names are not valid Python package identifiers. This replaces per-module
# sys.path manipulation in test files. Paths are resolved relative to the rootdir
# (the directory containing this file).
pythonpath =
    .
    scripts
    scripts/pypsa-at
    scripts/open-tyndp
