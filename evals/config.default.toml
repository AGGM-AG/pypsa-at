[global]

# store all evals results here results_path / subdir
subdir = "evaluation"

# regions inside these countries are kept during country aggregation
keep_regions = ["AT", "GB", "ES", "FR", "DE", "IT"]

# renames country/region NUTS codes to country/region names
region_nice_names = true

# Plot styling defaults (picked in build_plot_config())
cutoff_drop = true
stacked = true
line_shape = "hv"
legend_header = "Categories"
xaxis_title = "<b>Years</b>"
yaxis_color = "DarkSlateGrey"
footnotes = ["", ""]
legend_font_size = 20
title_font_size = 30
font_size = 20
xaxis_font_size = 20
yaxes_showgrid = false
yaxes_visible = false
file_name_template = "{metric}_{year}_{location}"

# Capacities

[view_capacity_heat_production]
name = "Heat Production Capacities"
unit = "GW"
file_name = "capacity_heat_production_{location}"
cutoff = 0.1
chart = "ESMGroupedBarChart"
storage_links = [
    "rural heat vent",
    "urban central heat vent",
    "urban decentral heat vent",
    # Heat Vent is a Generator that withdraws from heat buses.
    # The "optimal_capacity" statistic wrongly reports positive capacities for
    # heat vent carrier. We explicitly drop them here.
    "urban central water pits discharger",
    "urban central water tanks discharger",
    "urban decentral water tanks discharger",
    "rural water tanks discharger"
]
bus_carrier = ["urban central heat", "rural heat", "urban decentral heat"]
legend_order = [
    # from zero to top
    "Coal CHP",
    "Oil CHP",
    "Gas Boiler",
    "Gas CHP",
    "Biomass CHP",
    "Biomass Boiler",
    "Heat Pump",
    "Resistive Heater",
    "Solar Thermal",
    "Fischer-Tropsch",
    "Waste CHP",
    "H2 CHP",
    "Haber-Bosch",
    "Direct Air Capture",
    "Sabatier",
    "Electrolysis",
    "Methanolisation",
    "Methane Pyrolysis",
    "Fuel Cell",
]
checks = []
exports = []
# upload data model attributes
database_plot_type = "capacity"
database_bus_carrier = "heat"
database_specifier = "production"

