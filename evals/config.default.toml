[global]
subdir = "evaluation"

# Capacities

[view_capacity_heat_production]
name = "Heat Production Capacities"
unit = "GW"
file_name = "capacity_heat_production_{location}"
cutoff = 0.1
chart = "ESMGroupedBarChart"
storage_links = [
    "rural heat vent",
    "urban central heat vent",
    "urban decentral heat vent",
    # Heat Vent Ts a Generator that withdraws from heat buses.
    # The 'optimal_capacity' statistic wrongly reports positive capacities for
    # heat vent carrier. We explicitly drop them here.
    "urban central water pits discharger",
    "urban central water tanks discharger",
    "urban decentral water tanks discharger",
    "rural water tanks discharger"
]
bus_carrier = ["urban central heat", "rural heat", "urban decentral heat"]
legend_order = [
    # from zero to top
    "Coal CHP",
    "Oil CHP",
    "Gas Boiler",
    "Gas CHP",
    "Biomass CHP",
    "Biomass Boiler",
    "Heat Pump",
    "Resistive Heater",
    "Solar Thermal",
    "Fischer-Tropsch",
    "Waste CHP",
    "H2 CHP",
    "Haber-Bosch",
    "Direct Air Capture",
    "Sabatier",
    "Electrolysis",
    "Methanolisation",
    "Fuel Cell",
]
checks = []
exports = []

