site_name: pypsa-at
docs_dir: docs-at
repo_url: https://github.com/aggm-ag/pypsa-at
edit_uri: docs-at
site_dir: public
site_url: https://pypsa-at.readthedocs.io

nav:
- Home: index.md
- How-to-Guides:
  - how-to-guides/index.md
- Tutorials:
  - tutorials/index.md
  - tutorials/model-modifications.md
- Function Reference:
  - Modifications:
    - reference/mods/index.md
    - clustering.py: reference/mods/clustering.md
    - constraints.py: reference/mods/constraints.md
    - network_updates.py: reference/mods/network_updates.md
  - Evaluations:
    - reference/evals/index.md
    - cli.py: reference/evals/cli.md
    - constants.py: reference/evals/constants.md
    - fileio.py: reference/evals/fileio.md
    - statistic.py: reference/evals/statistic.md
    - utils.py: reference/evals/utils.md
    - Plots:
      - reference/evals/plots/index.md
      - components.py: reference/evals/plots/components.md
      - barchart.py: reference/evals/plots/barchart.md
      - facetbars.py: reference/evals/plots/facetbars.md
      - sankey.py: reference/evals/plots/sankey.md
      - timeseries.py: reference/evals/plots/timeseries.md
    - Views:
      - reference/evals/views/index.md
      - balances.py: reference/evals/views/balances.md
      - balances_timeseries.py: reference/evals/views/balances_timeseries.md
      - common.py: reference/evals/views/common.md
      - capacities.py: reference/evals/views/capacities.md
      - demand.py: reference/evals/views/demand.md
      - price.py: reference/evals/views/price.md
      - sankey.py: reference/evals/views/sankey.md
- Explanations:
  - explanations/index.md
  - National CO2 Balance: explanations/co2-balancing.md
  - Electricity Grid:
    - explanations/electricity-grid/index.md
    - NUTS3 Clustering: explanations/electricity-grid/nuts3-osm-data.md
    - OSM-AT Base Network: explanations/electricity-grid/osm-lines-at.md
    - Transmission Limits: explanations/electricity-grid/electricity-transmission.md

theme:
  name: "material"
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  features:
  - navigation.indexes
  - navigation.tracking
  - navigation.footer
#  - navigation.tabs
  - content.footnote.tooltips
  - content.code.copy
  - content.code.select
  - content.code.annotate
  - toc.follow
  - social

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/aggm-ag/pypsa-at
    name: github
  generator: true

copyright: Copyright &copy; 2024 - 2025 Austrian Gas Grid Management AG - all rights reserved.

plugins:
- search
- badges
- autorefs
- plotly
- marimo
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        inventories:
        - url: https://docs.pypsa.org/latest/objects.inv
        - url: https://pypsa-eur.readthedocs.io/en/latest/objects.inv
        - url: https://pathlib.readthedocs.io/en/latest/objects.inv
        - url: https://pandas.pydata.org/pandas-docs/stable/objects.inv
        - url: https://numpy.org/doc/stable/objects.inv
        - url: https://docs.python.org/3/objects.inv
        options:
          docstring_style: numpy
          show_source: true
          show_inheritance_diagram: false
          annotations_path: full
          filters:
          - "!^_"    # hide private members

# https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
markdown_extensions:
- attr_list
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- codehilite
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.superfences:
    custom_fences:
    - name: plotly
      class: mkdocs-plotly
      format: !!python/name:mkdocs_plotly_plugin.fences.fence_plotly
- tables

extra_css:
- assets/css/custom.css
