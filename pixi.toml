[feature.doc.tasks.build-docs]
cmd = "mkdocs build -d public/html"

[feature.doc.tasks.serve-docs]
cmd = "mkdocs serve"

[feature.doc.dependencies]
pygments = "*"
markdown-it-py = "*"
mkdocs = ">=1.6.1, <2"
mkdocs-marimo = ">=0.2.1, <0.3"
mkdocs-material = ">=9.7.1"
mkdocs-material-extensions = ">=1.3.1, <2"
mkdocstrings-python = ">=1.18.2, <2"
mknotebooks = ">=0.8.0, <0.9"
pymdown-extensions = ">=10.16.1, <11"

[feature.doc.pypi-dependencies]
mkdocs-badges = ">=0.5.2"
mkdocs-plotly-plugin = ">=0.1.3, <0.2"
mkdocs-table-reader-plugin = ">=3.1.0, <4"

[feature.test.tasks]

integration-tests = """
	echo "Run PyPSA-AT config..." &&
	snakemake -c4 all_at --configfile=config/test/config.at10.yaml &&
	echo "All tests completed successfully."
"""
clean-tests = """
    snakemake -call all_at --configfile=config/test/config.at10.yaml --delete-all-output ;
	echo "All test outputs have been cleaned up."
"""
unit-tests = "pytest test -m 'not AT'"

all-tests = {depends-on = ["integration-tests", "clean-tests", "unit-tests"]}

[feature.test.dependencies]
pytest = ">=8.4.2"
pytest-html = ">=4.2.0"

[feature.pypsa-at.dependencies]
anthropic = ">=0.85.0"
pixi-pycharm = ">=0.0.11,<0.0.12"
pydantic-ai-slim = ">=1.69.0"
odfpy = ">=1.4.1"

[environments]
doc = { features = ["doc"], no-default-feature = true }
test = {features = ["pypsa-at", "test"]}
default = {features = ["pypsa-at", "test"]}

[pypi-dependencies]
mkdocs-badges = ">=0.5.2"
snakemake-logger-plugin-pypsa = ">=0.1.0"
