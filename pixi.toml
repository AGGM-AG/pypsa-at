[workspace]
authors = ["Contributors to PyPSA-AT"]
channels = ["conda-forge", "bioconda", "gurobi"]
name = "pypsa-at"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

reset = """bash -c '
    read -p "Do you really wanna continue? This will remove all contents of \
logs, resources, benchmarks, results, and .snakemake directories except \
.gitkeep files (config/config.yaml will not be deleted) (y/n): " ans && \
    case $ans in \
        [Yy]*) \
            for dir in ./logs ./resources ./benchmarks ./results ./.snakemake; do \
                find "$dir" -mindepth 1 ! -name ".gitkeep" -delete 2>/dev/null || true; \
            done; \
            echo "Reset completed.";; \
        [Nn]*) \
            echo "Reset cancelled.";; \
        *) \
            echo "Please answer yes or no."; exit 1;; \
    esac'
"""

# maintained by PyPSA-AT
update-dags = """
	dot -c && \
	bash -c 'snakemake all_at --rulegraph \
	| sed -n "/digraph/,/^}/p" \
	| sed "s/digraph snakemake_dag {/digraph snakemake_dag {rankdir=LR;/" \
	| dot -Tpng -Gdpi=200 -o all_at-rulegraph.png' && \
	echo "Generated the rulegraph for all_at rule at ./all_at-rulegraph.png" && \
	bash -c 'snakemake all_at --filegraph \
	| sed -n "/digraph/,/^}/p" \
	| sed "s/digraph snakemake_dag {/digraph snakemake_dag {rankdir=LR;/" \
	| dot -Tpng -Gdpi=200 -o all_at-filegraph.png' && \
	echo "Generated the filegraph for all_at rule at ./all_at-filegraph.png"
"""

generate-config = "python -c 'from scripts.lib.validation.config import generate_config_defaults, generate_config_schema; generate_config_defaults(); generate_config_schema()'"

evals = "PYTHONPATH='./' python evals/cli.py run-eval"

workflow = "snakemake all_at -call"

sync-locks = """
    echo "Skipping task because PyPSA-AT does not support conda."
"""

