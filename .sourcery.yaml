# Sourcery configuration for PyPSA-AT.
# Reference: https://docs.sourcery.ai/Configuration/Project-Settings/
#
# Only the keys version, ignore, rule_settings, rules, rule_tags, metrics,
# github, clone_detection, proxy and coding_assistant are accepted; unknown
# keys make Sourcery reject the file. Natural-language review rules that
# mirror REVIEW.md live in the Sourcery dashboard (Repo settings → Review
# rules), and the AI reviewer's file scope in its "Path filters" setting.

version: '1'

ignore: # Paths the pattern-based rules engine will not analyse.
- .git
- .pixi
- .marimo
- .snakemake
- .devcontainer
- .vscode
- .idea
- env
- .env
- .tox
- venv
- .venv
- node_modules
- vendor
- ~/.pyenv
- ~/.rye
- ~/.vscode
- ~/.cache
- ~/.config
- ~/.local
# Workflow inputs and outputs
- bak
- benchmarks
- cutouts
- data
- logs
- networks
- resources
- results
- tmp
# Generated artefacts
- envs
- public
- docs-at/reference
- docs-at/site
- test/test_data
- '*.ipynb'
# Upstream PyPSA-Eur / PyPSA-DE / Open-TYNDP code (see CLAUDE.md); AT-owned
# scripts/pypsa-at and scripts/lib/validation stay in scope.
- scripts/*.py
- scripts/build_central_heating_temperature_profiles
- scripts/build_cop_profiles
- scripts/build_ptes_operations
- scripts/build_surface_water_heat_potentials
- scripts/definitions
- scripts/open-tyndp

rule_settings:
  enable:
  - default
  # REVIEW.md §3: typed parameters and return values (test files are excluded).
  - require-parameter-annotation
  - require-return-annotation
  # REVIEW.md §3: propose a split for functions with more than 40 statements.
  - no-long-functions
  # CLAUDE.md: prefer f-strings.
  - no-str-format
  - remove-breakpoint
  - remove-pdb-set_trace
  disable: []
  rule_types:
  - refactoring
  - suggestion
  - comment
  python_version: '3.12'

rules:
# CLAUDE.md: workflow and library code logs through `logging`.
- id: no-print-statements
  description: Use the module `logger` instead of `print` in workflow and library code
  explanation: |
    Snakemake captures script output through the `logging` module, so `print`
    calls are lost in workflow logs. Use `logger.info(...)` with an f-string.
  pattern: print(...)
  language: python
  paths:
    include:
    - mods
    - evals
    - scripts/pypsa-at
    - scripts/lib
    - test
  tests:
  - match: print("sth")
  - match: print(x, y)
  - no-match: logger.info(f"wrote {n} rows")
  - no-match: custom_print("sth")
  tags:
  - pypsa-at

# CLAUDE.md: pytest.ini configures `pythonpath`, no `sys.path` juggling in tests.
- id: no-sys-path-insert-in-tests
  description: Do not manipulate `sys.path` in tests; `pytest.ini` configures `pythonpath`
  explanation: |
    `pytest.ini` already makes `scripts/`, `scripts/pypsa-at/` and
    `scripts/open-tyndp/` importable. Import the module directly.
  pattern: sys.path.insert(...)
  language: python
  paths:
    include:
    - test
  tests:
  - match: |
      import sys
      sys.path.insert(0, "scripts")
  - no-match: |
      import sys
      sys.exit(1)
  tags:
  - pypsa-at

- id: no-sys-path-append-in-tests
  description: Do not manipulate `sys.path` in tests; `pytest.ini` configures `pythonpath`
  explanation: |
    `pytest.ini` already makes `scripts/`, `scripts/pypsa-at/` and
    `scripts/open-tyndp/` importable. Import the module directly.
  pattern: sys.path.append(...)
  language: python
  paths:
    include:
    - test
  tests:
  - match: |
      import sys
      sys.path.append("scripts")
  - no-match: |
      import sys
      sys.exit(1)
  tags:
  - pypsa-at

github:
  # Automated PRs (dependabot, lockfile updates) carry this label.
  ignore_labels:
  - sourcery-ignore
  request_review: author

coding_assistant:
  enabled: true
  # Context for the Sourcery IDE assistant only; pull request reviews do not use it.
  project_description: |
    PyPSA-AT is a sector-coupled energy system optimisation model for Austria
    built on PyPSA-Eur and PyPSA-DE, orchestrated with Snakemake and managed
    with Pixi (Python >= 3.12). Austria-specific logic lives in mods/ (network
    modifications), evals/ (post-processing), scripts/pypsa-at/ and
    rules/pypsa-at/; everything else is upstream code and must not be changed.
    Review criteria are defined in REVIEW.md, conventions in CLAUDE.md.
