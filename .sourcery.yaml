# Sourcery configuration for PyPSA-AT.
#
# 📚 Reference: https://docs.sourcery.ai/Configuration/Project-Settings/
#
# What this file can and cannot do
# --------------------------------
# Sourcery validates this file strictly: only the keys `version`, `ignore`,
# `rule_settings`, `rules`, `rule_tags`, `metrics`, `github`, `clone_detection`,
# `proxy` and `coding_assistant` are accepted. An unknown key makes Sourcery
# reject the whole file, so do not add free-text review instructions here.
#
# The natural-language review rules that encode REVIEW.md and CLAUDE.md live
# in the Sourcery dashboard (Repo settings → Review rules). The canonical list
# to paste there is maintained in .github/sourcery-review-rules.md.
#
# `ignore` and `rule_settings` drive the pattern-based rules engine (IDE, CLI
# and the rule comments on pull requests). Which files the AI reviewer looks
# at is controlled by the dashboard "Path filters" setting instead.

version: '1'  # The schema version of this config file

ignore: # Paths the pattern-based rules engine will not analyse.
# Tooling and environments
- .git
- .pixi
- .marimo
- .snakemake
- .devcontainer
- .vscode
- .idea
- env
- .env
- .tox
- venv
- .venv
- node_modules
- vendor
- ~/.pyenv
- ~/.rye
- ~/.vscode
- ~/.cache
- ~/.config
- ~/.local
# Workflow inputs and outputs (git-ignored, GB-scale)
- bak
- benchmarks
- cutouts
- data
- logs
- networks
- resources
- results
- tmp
# Generated artefacts
- envs
- public
- docs-at/reference
- docs-at/site
- test/test_data
- '*.ipynb'
# Upstream PyPSA-Eur / PyPSA-DE / Open-TYNDP code is kept as close to upstream
# as possible (see CLAUDE.md "Upstream files — do NOT touch"), so no
# refactoring suggestions there. AT-owned code under scripts/pypsa-at and
# scripts/lib/validation stays in scope.
- scripts/*.py
- scripts/build_central_heating_temperature_profiles
- scripts/build_cop_profiles
- scripts/build_ptes_operations
- scripts/build_surface_water_heat_potentials
- scripts/definitions
- scripts/open-tyndp

rule_settings:
  enable:
  - default
  # REVIEW.md §3 "Keep code maintainable": typed parameters and return values.
  # Both rules exclude test_*.py files themselves.
  - require-parameter-annotation
  - require-return-annotation
  # REVIEW.md §3: propose a split when a function does too much (> 40 statements).
  - no-long-functions
  # CLAUDE.md: prefer f-strings over other formatting.
  - no-str-format
  # Never ship debugger breakpoints.
  - remove-breakpoint
  - remove-pdb-set_trace
  disable: []  # A list of rule IDs Sourcery will never suggest.
  rule_types:
  - refactoring
  - suggestion
  - comment
  python_version: '3.12' # Lowest Python version supported by the project (pixi.toml: python >= 3.12).

rules:
# CLAUDE.md "Conventions & Key Patterns": scripts and library code log through
# `logging`; print output belongs to CLI entry points only.
- id: no-print-statements
  description: Use the module `logger` instead of `print` in workflow and library code
  explanation: |
    Snakemake captures script output through the `logging` module, so `print`
    calls are lost in workflow logs. Use `logger.info(...)` / `logger.debug(...)`
    with an f-string instead. Print is fine in stand-alone CLI tools (`utils/`).
  pattern: print(...)
  language: python
  paths:
    include:
    - mods
    - evals
    - scripts/pypsa-at
    - scripts/lib
    - test
  tests:
  - match: print("sth")
  - match: print(x, y)
  - no-match: logger.info(f"wrote {n} rows")
  - no-match: custom_print("sth")
  tags:
  - pypsa-at

# CLAUDE.md "Writing Tests": pytest.ini already puts `.`, `scripts`,
# `scripts/pypsa-at` and `scripts/open-tyndp` on `pythonpath`.
- id: no-sys-path-insert-in-tests
  description: Do not manipulate `sys.path` in tests; `pytest.ini` configures `pythonpath`
  explanation: |
    `pytest.ini` already makes `scripts/`, `scripts/pypsa-at/` and
    `scripts/open-tyndp/` importable. Import the module directly instead of
    editing `sys.path`.
  pattern: sys.path.insert(...)
  language: python
  paths:
    include:
    - test
  tests:
  - match: |
      import sys
      sys.path.insert(0, "scripts")
  - no-match: |
      import sys
      sys.exit(1)
  tags:
  - pypsa-at

- id: no-sys-path-append-in-tests
  description: Do not manipulate `sys.path` in tests; `pytest.ini` configures `pythonpath`
  explanation: |
    `pytest.ini` already makes `scripts/`, `scripts/pypsa-at/` and
    `scripts/open-tyndp/` importable. Import the module directly instead of
    editing `sys.path`.
  pattern: sys.path.append(...)
  language: python
  paths:
    include:
    - test
  tests:
  - match: |
      import sys
      sys.path.append("scripts")
  - no-match: |
      import sys
      sys.exit(1)
  tags:
  - pypsa-at

# rule_tags: {} # Additional rule tags.

# metrics:
#   quality_threshold: 25.0

github:
  # Pull requests carrying any of these labels are skipped entirely. Automated
  # PRs (dependabot, lockfile updates) are labelled `sourcery-ignore` by their
  # workflows.
  ignore_labels:
  - sourcery-ignore
  # Sourcery requests a review from the PR author once it has posted its review.
  request_review: author

# clone_detection:
#   min_lines: 3
#   min_duplicates: 2
#   identical_clones_only: false

# proxy:
#   url:
#   ssl_certs_file:
#   no_ssl_verify: false

coding_assistant:
  enabled: true
  # Context handed to the Sourcery IDE assistant (not used by pull request reviews).
  project_description: |
    PyPSA-AT is a sector-coupled energy system optimisation model for Austria
    built on PyPSA-Eur and PyPSA-DE, orchestrated with Snakemake and managed
    with Pixi (Python >= 3.12). Austria-specific logic lives in mods/ (network
    modifications), evals/ (post-processing), scripts/pypsa-at/ and
    rules/pypsa-at/; everything else is upstream code and must not be changed.
    Review criteria are defined in REVIEW.md, conventions in CLAUDE.md.
