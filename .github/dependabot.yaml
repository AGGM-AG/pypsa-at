# dependabot
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# ------------------------------------------------------------------------------
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7   # let upstream react to compromised or broken releases first
  labels:
  - dependencies
  - github_actions
  - sourcery-ignore  # skip Sourcery reviews on automated action bumps (see .sourcery.yaml)
  groups:
    # open a single pull-request for all GitHub actions updates
    github-actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directories:
  - /**/*
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
