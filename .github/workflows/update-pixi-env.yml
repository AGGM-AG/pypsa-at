name: Update Pixi Dependencies

on:
  schedule:
    # Runs every Sunday at 2:00 AM UTC
  - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest

    - name: Update dependencies
      run: pixi update

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.PIXI_CI_ACTION_TOKEN }}
        commit-message: "chore: update pixi dependencies"
        title: "chore: update pixi dependencies"
        body: |
          Automated dependency update by GitHub Actions.

          Please review the changes and ensure CI tests pass before merging.
        branch: pixi-dependency-update
        delete-branch: true
        labels: dependencies,automated
