name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, edited, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Reviews a pull request on demand, when a trusted user comments
  # "@claude review" on the PR (or in a review / review comment).
  claude-review:
    if: |
      contains(fromJson('["pworschischek-aggmag", "nicolezechneraggm"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # On an issue_comment event the default ref is the default branch, so
        # without this the workspace holds main and the review sees none of
        # the pull request's changes.
        ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
        fetch-depth: 0

    - name: Run Claude Code review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Allows Claude to read CI results on PRs
        additional_permissions: |
          actions: read
        plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
        plugins: "code-review@claude-code-plugins"
        prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number || github.event.pull_request.number }}"
        # --setting-sources user: do not load the in-repo .claude/settings.json,
        # which enables plugins from marketplaces the runner never installs and
        # so aborts the CLI at startup.
        # --allowedTools: this is an exclusive allowlist, so it has to name
        # every tool the code-review skill uses, not just the one that starts
        # the inline-comment MCP server. The skill drives everything through
        # gh (pr diff/view/comment) and fans out over subagents, so Task, the
        # read-only file tools and the gh subcommands from its own
        # allowed-tools frontmatter all have to be listed here.
        claude_args: |
          --setting-sources user
          --allowedTools "Task,Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"

  # Responds to any other @claude mention in an issue, PR comment or review.
  # Excludes "@claude review", which is handled by the claude-review job above.
  claude:
    if: |
      contains(fromJson('["pworschischek-aggmag", "nicolezechneraggm"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude review')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Allows Claude to read CI results on PRs
        additional_permissions: |
          actions: read
