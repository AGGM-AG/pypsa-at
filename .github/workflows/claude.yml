name: Claude Code

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, edited, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Responds when someone mentions @claude in an issue, PR comment or review.
  claude:
    if: |
      contains(fromJson('["pworschischek-aggmag", "nicolezechneraggm"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Allows Claude to read CI results on PRs
        additional_permissions: |
          actions: read

  # Reviews every pull request automatically as soon as it is opened
  # (or marked ready for review after being a draft).
  claude-review:
    if: |
      github.event_name == 'pull_request' &&
      contains(fromJson('["pworschischek-aggmag", "nicolezechneraggm"]'), github.actor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Claude Code review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        track_progress: true
        use_sticky_comment: true
        additional_permissions: |
          actions: read
        prompt: |
          Review this pull request for the PyPSA-AT energy system model.

          Follow the repository guidelines in CLAUDE.md. Pay particular
          attention to:
          - Correctness and clear, actionable bug reports
          - Changes to upstream files (scripts/*.py outside scripts/pypsa-at/,
            rules/ outside rules/pypsa-at/, config/config.default.yaml,
            config/config.de.yaml) which should only be touched for critical hotfixes
          - Missing or insufficient tests in test/test_mods/ and test/test_evals/
          - Snakemake rule/script conventions (1:1 rule-to-script mapping,
            no new wildcards, guard logic in Python not in the DAG)

          Post a concise review. Skip nitpicks that a linter already covers.
