name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, edited, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Reviews a pull request on demand, when a trusted user comments
  # "@claude review" on the PR (or in a review / review comment).
  claude-review:
    if: |
      contains(fromJson('["pworschischek-aggmag", "nicolezechneraggm"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Claude Code review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Allows Claude to read CI results on PRs
        additional_permissions: |
          actions: read
        # Do not load the in-repo .claude/settings.json: it enables plugins
        # from marketplaces that are not installed on the runner, which makes
        # the CLI abort at startup. CLAUDE.md is still read as a file.
        claude_args: |
          --setting-sources user
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

          Review the pull request above for the PyPSA-AT energy system model.

          Read the repository's root CLAUDE.md first and follow its
          guidelines. Pay particular attention to:
          - Correctness and clear, actionable bug reports
          - Changes to upstream files (scripts/*.py outside scripts/pypsa-at/,
            rules/ outside rules/pypsa-at/, config/config.default.yaml,
            config/config.de.yaml) which should only be touched for critical hotfixes
          - Missing or insufficient tests in test/test_mods/ and test/test_evals/
          - Snakemake rule/script conventions (1:1 rule-to-script mapping,
            no new wildcards, guard logic in Python not in the DAG)

          Post a concise review as a comment on the pull request.
          Skip nitpicks that a linter already covers.

    # The action sanitises Claude's own error text out of the run log, which
    # makes a failed review undiagnosable. Print just the final result
    # message's error string - not the transcript, which on this public
    # repository would expose tool output in world-readable logs.
    # Remove once the review job is working.
    - name: Show Claude error on failure
      if: failure()
      run: |
        f="${RUNNER_TEMP}/claude-execution-output.json"
        if [ ! -f "$f" ]; then
          echo "No execution log at $f"
          exit 0
        fi
        python3 - "$f" <<'PY'
        import json, sys

        with open(sys.argv[1]) as fh:
            messages = json.load(fh)

        results = [m for m in messages if m.get("type") == "result"]
        if not results:
            print("No result message in execution log")
            sys.exit(0)

        last = results[-1]
        for key in ("subtype", "is_error", "num_turns"):
            print(f"{key}: {last.get(key)}")
        for key in ("result", "error"):
            value = last.get(key)
            if value:
                print(f"{key}: {str(value)[:2000]}")
        PY

  # Responds to any other @claude mention in an issue, PR comment or review.
  # Excludes "@claude review", which is handled by the claude-review job above.
  claude:
    if: |
      contains(fromJson('["pworschischek-aggmag", "nicolezechneraggm"]'), github.actor) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude review')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Allows Claude to read CI results on PRs
        additional_permissions: |
          actions: read
