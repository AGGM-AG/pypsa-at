name: Update locked envs
on:
  push:
    paths:
    - pixi.toml
  schedule:
  - cron: "0 8 1,16 * *" # Bi-weekly
  workflow_dispatch:

jobs:
  update-locked-environment:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Update lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.59.0

    - name: Update lockfile
      run: |
        rm pixi.lock
        pixi install --all

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: lockfiles
        path: |
          pixi.lock

  create-pull-request:
    needs: update-locked-environment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        name: lockfiles

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.PIXI_CI_ACTION_TOKEN }}
        branch: update-locked-environment
        title: "[github-actions.ci] Update locked envs"
        body: |
          Automatically generated PR to update the pixi lockfile.

          Integration tests are triggered automatically after this PR is created.
        commit-message: "Update locked environment files for pixi"

    - name: Trigger integration tests
      if: steps.cpr.outputs.pull-request-number != ''
      run: gh workflow run test.yaml --ref update-locked-environment
      env:
        GH_TOKEN: ${{ secrets.PIXI_CI_ACTION_TOKEN }}
