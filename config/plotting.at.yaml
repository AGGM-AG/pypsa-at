# PyPSA-AT plotting overlay. Adds tech_colors for AT-specific carriers that are
# not present in PyPSA-Eur/PyPSA-DE. Loaded last in the config stack so it has
# the final word on plotting values (see Snakefile).
plotting:
  tech_colors:
    # missing from upstream
    municipal solid waste transport: "#91ba41"
    # PHS is split into charger/discharger/store/inflow components in PyPSA-AT, so
    # the upstream "PHS" rename key does not match. Colour them like PHS ('#51dbcc').
    PHS charger: '#51dbcc'
    PHS discharger: '#51dbcc'
    PHS store: '#51dbcc'
    PHS inflow: '#51dbcc'
    # hydro reservoirs are likewise split into discharger/store/inflow components.
    # Colour them like hydro ('#298c81').
    hydro discharger: '#298c81'
    hydro store: '#298c81'
    hydro inflow: '#298c81'
    # sectoral demands split out of the electricity base load. Rail and road
    # take shades of 'land transport demand' ('#38baf2') to match the
    # transport sector colours; residential and services take shades of
    # 'electricity' ('#110d63').
    electricity for rail: '#2b96c4'
    electricity for road: '#66cbf5'
    electricity for residential: '#2f2a8a'
    electricity for services: '#5a54b5'
    # on-site methane pyrolysis H2 pathway (mods/network/h2.py)
    methane pyrolysis plasma: '#40E0D0'
    # gas supply split into LNG, pipeline and production generators
    # (mods/network/gas.py). Colour them like gas ('#e05b09').
    lng gas: '#e05b09'
    pipeline gas: '#e05b09'
    production gas: '#e05b09'
    # fallback for components without carrier. Upstream schema requires hex.
    "": '#000000'
    none: '#000000'
