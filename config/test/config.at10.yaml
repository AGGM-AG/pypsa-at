run:
  prefix: "test-sector-myopic-at10"
  name:
  - AT_KN2040

# need to include additional neighbor countries, because the
# administrative clustering will not filter lines to connected
# to countries not listed in `countries` and consistency checks
# raise an Exception for components that have buses not defined in
# the buses table.
countries: ['DE', 'AT', 'CH', "CZ", "SI", "HU", "IT"]
clustering:
  mode: administrative
  administrative:
    level: 0 # countries
    AT: 2  # 10 regions
    IT: 0  # Sicily and Sardinia outside cutouts would receive 0 population fraction and cause 0 population_weighted_energy_totals
  temporal:
    resolution_sector: 24H

snapshots:
  start: "2013-03-01"
  end: "2013-03-08"

atlite:
  default_cutout: dach-03-2013-sarah3-era5
  nprocesses: 2  # prevents out of memory errors in CI during atlite jobs
  cutouts:
    dach-03-2013-sarah3-era5:
      module: [sarah, era5] # in priority order
      x: [5., 18.]
      y: [45., 56.]
      time: ["2013-03-01", "2013-03-08"]

industry:
  annual_demand_overrides:
    enable: false

renewable:
  onwind:
    cutout: dach-03-2013-sarah3-era5
  offwind-ac:
    cutout: dach-03-2013-sarah3-era5
    max_depth: false
  offwind-dc:
    cutout: dach-03-2013-sarah3-era5
    max_depth: false
  offwind-float:
    cutout: dach-03-2013-sarah3-era5
    max_depth: false
    min_depth: false
  solar:
    cutout: dach-03-2013-sarah3-era5
  solar-hsat:
    cutout: dach-03-2013-sarah3-era5

electricity:
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc] # removed hydro, offwind-float

demand:
  transport:
    use_nea_demand: false
  heat:
    apply_at_demand: false

solving:
  solver:
    name: highs
    options: highs-default
  constraints:
    limits_volume_min: # in TWh/a
      solar:
        AT:
          2030: 0
      wind:
        AT:
          2030: 0
      biomass:
        AT:
          2030: 0

mods:
  modify_nuts3_shapes: AT10DE5
